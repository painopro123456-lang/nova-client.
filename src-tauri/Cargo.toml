[package]
name = "nova-client"
version = "0.1.316"
description = "NOVA Client desktop application"
authors = ["NOVA Client"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
crust_core = "1.0.3"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time"] }
serde_json = "1"
keyring = "3"
webbrowser = "1"
zip = { version = "7.2", default-features = false, features = ["deflate"] }
sha1 = "0.11"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["dpapi", "wincrypt", "winbase", "errhandlingapi", "sysinfoapi"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
