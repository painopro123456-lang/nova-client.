name: Frontend validation

on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/**']
    paths:
      - "src/**"
      - "package.json"
      - "index.html"
      - "vite.config.js"
      - ".github/workflows/frontend-check.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
