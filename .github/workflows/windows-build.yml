name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "index.html"
      - "vite.config.js"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # A repository name ending in a period is not a valid Windows
          # checkout directory. Use a safe working directory instead.
          path: nova-src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        working-directory: nova-src
        run: npm install

      - name: Build NOVA Windows installer
        working-directory: nova-src
        run: npm run tauri -- build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Client-Windows-Installer
          path: nova-src/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
