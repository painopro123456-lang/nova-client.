name: Windows build

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional version tag to publish (example: v0.1.1). Leave blank for a build only."
        required: false
        type: string
  push:
    branches: [main, 'fix/**']
    tags: ['v*']
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.js"
      - ".github/workflows/windows-build.yml"

concurrency:
  group: nova-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Clone source to a Windows-safe path
        shell: pwsh
        working-directory: D:/a
        run: git clone --depth 1 --branch "${{ github.ref_name }}" https://github.com/painopro123456-lang/nova-client..git nova-src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: C:/npm/cache
          key: windows-npm-${{ github.sha }}
          restore-keys: windows-npm-

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            D:/a/nova-src/src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-rust-${{ github.sha }}
          restore-keys: windows-rust-

      - name: Install dependencies
        working-directory: D:/a/nova-src
        run: npm ci

      - name: Generate Windows app icon
        shell: pwsh
        working-directory: D:/a/nova-src
        run: |
          Add-Type -AssemblyName System.Drawing
          $iconDir = Join-Path (Get-Location) "src-tauri/icons"
          New-Item -ItemType Directory -Force -Path $iconDir | Out-Null
          $bitmap = New-Object System.Drawing.Bitmap 256, 256
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $graphics.Clear([System.Drawing.Color]::FromArgb(10, 13, 29))
          $rect = New-Object System.Drawing.Rectangle 18, 18, 220, 220
          $brush = New-Object System.Drawing.Drawing2D.LinearGradientBrush($rect, [System.Drawing.Color]::FromArgb(151, 125, 255), [System.Drawing.Color]::FromArgb(65, 205, 235), 45)
          $graphics.FillEllipse($brush, $rect)
          $cut = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(10, 13, 29))
          $graphics.FillEllipse($cut, 82, 24, 154, 154)
          $points = [System.Drawing.Point[]]@(
            (New-Object System.Drawing.Point 176, 42),
            (New-Object System.Drawing.Point 187, 72),
            (New-Object System.Drawing.Point 217, 83),
            (New-Object System.Drawing.Point 187, 94),
            (New-Object System.Drawing.Point 176, 124),
            (New-Object System.Drawing.Point 165, 94),
            (New-Object System.Drawing.Point 135, 83),
            (New-Object System.Drawing.Point 165, 72)
          )
          $star = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::White)
          $graphics.FillPolygon($star, $points)
          $handle = $bitmap.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($handle)
          $stream = [System.IO.File]::Create((Join-Path $iconDir "icon.ico"))
          $icon.Save($stream)
          $stream.Dispose()
          $icon.Dispose()
          $graphics.Dispose()
          $bitmap.Dispose()
          $brush.Dispose()
          $cut.Dispose()
          $star.Dispose()

      - name: Set release version
        id: version
        shell: pwsh
        working-directory: D:/a/nova-src
        run: |
          $requested = "${{ inputs.release_version }}"
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart('v')
          } elseif (-not [string]::IsNullOrWhiteSpace($requested)) {
            $version = $requested.TrimStart('v')
          } else {
            $version = "0.1.${{ github.run_number }}"
          }
          if ($version -notmatch '^\\d+\\.\\d+\\.\\d+        working-directory: D:/a/nova-src
        run: npm run build

      - name: Run Rust unit tests
        working-directory: D:/a/nova-src
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build NOVA Windows installer (verbose)
        working-directory: D:/a/nova-src
        env:
          CARGO_TERM_COLOR: always
          RUST_BACKTRACE: 1
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: npm run tauri -- build --verbose

      - name: Give installer a clean filename
        shell: pwsh
        working-directory: D:/a/nova-src
        run: |
          $installerDir = "src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem -Path $installerDir -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          $target = Join-Path $installerDir "NOVA-Client-Setup.exe"
          if ($installers[0].FullName -ne (Join-Path (Get-Location) $target)) {
            Move-Item -LiteralPath $installers[0].FullName -Destination $target -Force
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Client-Windows-Installer
          path: D:/a/nova-src/src-tauri/target/release/bundle/nsis/NOVA-Client-Setup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish versioned GitHub release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
        uses: softprops/action-gh-release@v2
        with:
          name: NOVA Client v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          files: D:/a/nova-src/src-tauri/target/release/bundle/nsis/NOVA-Client-Setup.exe
          fail_on_unmatched_files: true
) { throw "Invalid release version: $version" }
          $cargo = Get-Content "src-tauri/Cargo.toml" -Raw
          $cargo = [regex]::Replace($cargo, '(?m)^version = ".*"        working-directory: D:/a/nova-src
        run: npm run build

      - name: Run Rust unit tests
        working-directory: D:/a/nova-src
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build NOVA Windows installer (verbose)
        working-directory: D:/a/nova-src
        env:
          CARGO_TERM_COLOR: always
          RUST_BACKTRACE: 1
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: npm run tauri -- build --verbose

      - name: Give installer a clean filename
        shell: pwsh
        working-directory: D:/a/nova-src
        run: |
          $installerDir = "src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem -Path $installerDir -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          $target = Join-Path $installerDir "NOVA-Client-Setup.exe"
          if ($installers[0].FullName -ne (Join-Path (Get-Location) $target)) {
            Move-Item -LiteralPath $installers[0].FullName -Destination $target -Force
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Client-Windows-Installer
          path: D:/a/nova-src/src-tauri/target/release/bundle/nsis/NOVA-Client-Setup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish versioned GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_version != ''
        uses: softprops/action-gh-release@v2
        with:
          name: NOVA Client ${{ inputs.release_version || github.ref_name }}
          tag_name: ${{ inputs.release_version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: D:/a/nova-src/src-tauri/target/release/bundle/nsis/NOVA-Client-Setup.exe
          fail_on_unmatched_files: true
, "version = `"$version`"", 1)
          Set-Content -Path "src-tauri/Cargo.toml" -Value $cargo -NoNewline
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw
          $config = [regex]::Replace($config, '"version": ".*?"', "`"version`": `"$version`"", 1)
          Set-Content -Path "src-tauri/tauri.conf.json" -Value $config -NoNewline
          $package = Get-Content "package.json" -Raw
          $package = [regex]::Replace($package, '"version": ".*?"', "`"version`": `"$version`"", 1)
          Set-Content -Path "package.json" -Value $package -NoNewline
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building NOVA version $version"

      - name: Verify frontend production build
        working-directory: D:/a/nova-src
        run: npm run build

      - name: Run Rust unit tests
        working-directory: D:/a/nova-src
        run: cargo test --manifest-path src-tauri/Cargo.toml

