name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "index.html"
      - "vite.config.js"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Clone source to a Windows-safe path
        shell: pwsh
        working-directory: D:/a
        run: git clone --depth 1 https://github.com/painopro123456-lang/nova-client..git nova-src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        working-directory: D:/a/nova-src
        run: npm install

      - name: Generate Windows app icon
        shell: pwsh
        working-directory: D:/a/nova-src
        run: |
          Add-Type -AssemblyName System.Drawing
          $iconDir = Join-Path (Get-Location) "src-tauri/icons"
          New-Item -ItemType Directory -Force -Path $iconDir | Out-Null
          $bitmap = New-Object System.Drawing.Bitmap 256, 256
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $graphics.Clear([System.Drawing.Color]::FromArgb(12, 15, 34))
          $rect = New-Object System.Drawing.Rectangle 12, 12, 232, 232
          $brush = New-Object System.Drawing.Drawing2D.LinearGradientBrush($rect, [System.Drawing.Color]::FromArgb(125, 82, 255), [System.Drawing.Color]::FromArgb(35, 205, 230), 45)
          $graphics.FillEllipse($brush, $rect)
          $font = New-Object System.Drawing.Font("Segoe UI", 104, [System.Drawing.FontStyle]::Bold, [System.Drawing.GraphicsUnit]::Pixel)
          $textBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::White)
          $format = New-Object System.Drawing.StringFormat
          $format.Alignment = [System.Drawing.StringAlignment]::Center
          $format.LineAlignment = [System.Drawing.StringAlignment]::Center
          $graphics.DrawString("N", $font, $textBrush, (New-Object System.Drawing.RectangleF 12, 10, 232, 232), $format)
          $handle = $bitmap.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($handle)
          $stream = [System.IO.File]::Create((Join-Path $iconDir "icon.ico"))
          $icon.Save($stream)
          $stream.Dispose()
          $icon.Dispose()
          $graphics.Dispose()
          $bitmap.Dispose()
          $font.Dispose()
          $brush.Dispose()
          $textBrush.Dispose()
          $format.Dispose()

      - name: Verify frontend production build
        working-directory: D:/a/nova-src
        run: npm run build

      - name: Build NOVA Windows installer (verbose)
        working-directory: D:/a/nova-src
        env:
          CARGO_TERM_COLOR: always
          RUST_BACKTRACE: 1
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: npm run tauri -- build --verbose

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Client-Windows-Installer
          path: D:/a/nova-src\\src-tauri\\target\\release\\bundle\\nsis\\*.exe
          if-no-files-found: error
          retention-days: 14
